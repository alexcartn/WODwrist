name: Deploy web editor

# Publishes web-editor/ at https://<owner>.github.io/<repo>/
# The coach's WOD lives at wod/today.json (written by the editor's Publish button).
# One-time setup: repo Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [master]
    paths: ["web-editor/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r web-editor/index.html web-editor/style.css web-editor/js web-editor/wod _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

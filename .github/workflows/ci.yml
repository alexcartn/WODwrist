name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generated files are up to date
        run: |
          python3 tools/gen_movements.py --check
          node tools/gen_mc_tests.mjs --check

      - name: Web editor tests (parser + timer engine reference)
        working-directory: web-editor
        run: npm test

      - name: rep-lab tests
        working-directory: rep-lab
        run: |
          pip install -r requirements.txt
          python -m pytest -q

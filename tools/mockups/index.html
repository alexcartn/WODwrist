const F={xtiny:26,tiny:30,small:34,medium:40,large:52,nhot:120,nthai:158};
function mk(title,w,h,sq,draw){
  const it=document.createElement("div");it.className="item";

}
function t(d,x,y,size,col,s,opts={}){d.fillStyle=col;const num=opts.num;

// ---- Menu2 look ----
function menu(d,w,h,title,items,sel){
  t(d,w/2,h*0.12,F.tiny,C.white,title,{bold:1});

  });
}
// ---- RunView port ----
function run(d,w,h,o){

    t(d,x,h*0.21,F.tiny,C.lt,a,{align:"left"});t(d,x+w1,h*0.21,F.tiny,o.delta[0]=="-"?C.green:C.red,o.delta,{align:"left"});}
  else t(d,cx,h*0.21,F.tiny,C.lt,o.round);
  if(o.coach){t(d,cx,h*0.47,F.nthai,o.paused?C.orange:C.white,o.clock,{num:1});
    if(o.move)t(d,cx,h*0.76,F.small,o.moveCol||C.white,o.move);return;}
  t(d,cx,h*0.40,F.nhot,o.paused?C.orange:C.white,o.clock,{num:1});
  if(o.next!==undefined){ if(o.next){t(d,cx,h*0.61,F.xtiny,C.lt,"NEXT");t(d,cx,h*0.72,F.small,C.white,o.next);} else t(d,cx,h*0.66,F.small,C.lt,"Last interval"); }
  else if(o.name){t(d,cx,h*0.62,F.small,C.white,o.name);

  if(o.foot)t(d,cx,h*0.88,F.xtiny,C.lt,o.foot);
}
function preview(d,w,h,name,head,lines,mode,hist){

}
function hints(d,w,h){const cx=w/2;t(d,cx,h*0.83,F.xtiny,C.green,"START save");t(d,cx,h*0.90,F.xtiny,C.lt,"BACK discard");}

  hints(d,w,h);
}

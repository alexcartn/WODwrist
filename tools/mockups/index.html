const F={xtiny:26,tiny:30,small:34,medium:40,large:52,nhot:120,nthai:158};
function mk(title,w,h,sq,draw){
  const it=document.createElement("div");it.className="item";

}
function t(d,x,y,size,col,s,opts={}){d.fillStyle=col;const num=opts.num;

// ---- Menu2 look ----
function menu(d,w,h,title,items,sel){
  t(d,w/2,h*0.12,F.tiny,C.white,title,{bold:1});

  });
}
// ---- RunView port ----
function run(d,w,h,o){

    t(d,x,h*0.21,F.tiny,C.lt,a,{align:"left"});t(d,x+w1,h*0.21,F.tiny,o.delta[0]=="-"?C.green:C.red,o.delta,{align:"left"});}
  else t(d,cx,h*0.21,F.tiny,C.lt,o.round);
  if(o.coach){t(d,cx,h*0.47,F.nthai,o.paused?C.orange:C.white,o.clock,{num:1});
    if(o.move)t(d,cx,h*0.76,F.small,o.moveCol||C.white,o.move);return;}
  t(d,cx,h*0.40,F.nhot,o.paused?C.orange:C.white,o.clock,{num:1});
  if(o.next!==undefined){ if(o.next){t(d,cx,h*0.61,F.xtiny,C.lt,"NEXT");t(d,cx,h*0.72,F.small,C.white,o.next);} else t(d,cx,h*0.66,F.small,C.lt,"Last interval"); }
  else if(o.name){t(d,cx,h*0.62,F.small,C.white,o.name);

  if(o.foot)t(d,cx,h*0.88,F.xtiny,C.lt,o.foot);
}
function preview(d,w,h,name,head,lines,mode,hist){

}
function hints(d,w,h){const cx=w/2;t(d,cx,h*0.83,F.xtiny,C.green,"START save");t(d,cx,h*0.90,F.xtiny,C.lt,"BACK discard");}

  hints(d,w,h);
}

function ringUx(d,w,h,frac,color,rw){const cx=w/2,cy=h/2,r=w/2-rw/2-1;d.lineWidth=rw;d.strokeStyle=C.dk;d.beginPath();d.arc(cx,cy,r,0,7);d.stroke();
  if(frac>0){d.strokeStyle=color;d.beginPath();d.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*frac);d.stroke();}d.lineWidth=1;}
function innerUx(d,w,h,frac,color,inset){const cx=w/2,cy=h/2,r=w/2-inset;d.lineWidth=3;d.strokeStyle=color;const a0=150*Math.PI/180;d.beginPath();d.arc(cx,cy,r,a0,a0-(-120*frac)*Math.PI/180);d.stroke();d.lineWidth=1;}
function dotsUx(d,w,h,page,n){const gap=h/30,x=w-w/25,y0=h/2-(n-1)*gap/2;for(let i=0;i<n;i++){d.fillStyle=i==page?C.white:C.dk;d.beginPath();d.arc(x,y0+i*gap,i==page?4:3,0,7);d.fill();}}
function hintUx(d,w,h,top,color,icon){const deg=top?30:-30,cx=w/2,cy=h/2;d.lineWidth=6;d.strokeStyle=color;d.beginPath();
  d.arc(cx,cy,w/2-4,-(deg+8)*Math.PI/180,-(deg-8)*Math.PI/180);d.stroke();const rad=deg*Math.PI/180,r=w/2-w/16,x=cx+r*Math.cos(rad),y=cy-r*Math.sin(rad),k=w/50;
  d.lineWidth=3;d.fillStyle=color;d.beginPath();
  if(icon=="check"){d.moveTo(x-k,y);d.lineTo(x-k/3,y+k*2/3);d.lineTo(x+k,y-k*2/3);d.stroke();}
  else if(icon=="cross"){d.moveTo(x-k*2/3,y-k*2/3);d.lineTo(x+k*2/3,y+k*2/3);d.moveTo(x-k*2/3,y+k*2/3);d.lineTo(x+k*2/3,y-k*2/3);d.stroke();}
  else{d.moveTo(x-k*2/3,y-k);d.lineTo(x-k*2/3,y+k);d.lineTo(x+k,y);d.fill();}d.lineWidth=1;}
function runUx(d,w,h,o){const cx=w/2;ringUx(d,w,h,o.frac,o.color,o.coach?w/28:w/40);
  t(d,cx,h*0.12,F.tiny,o.color,o.label);
  if(o.delta){d.font="500 "+F.tiny+"px Roboto,Arial,sans-serif";const a=o.round+"  ",w1=d.measureText(a).width,w2=d.measureText(o.delta).width,x=cx-(w1+w2)/2;
    t(d,x,h*0.22,F.tiny,C.lt,a,{align:"left"});t(d,x+w1,h*0.22,F.tiny,o.delta[0]=="-"?C.green:C.red,o.delta,{align:"left"});} else t(d,cx,h*0.22,F.tiny,C.lt,o.round);
  if(o.coach){t(d,cx,h*0.47,F.nthai,C.white,o.clock,{num:1});if(o.move)t(d,cx,h*0.76,F.small,C.white,o.move);}
  else{t(d,cx,h*0.41,F.nhot,C.white,o.clock,{num:1});
    if(o.name){t(d,cx,h*0.62,F.small,C.white,o.name);t(d,cx,h*0.75,F.medium,C.yellow,o.reps,{bold:1});if(o.repFrac)innerUx(d,w,h,o.repFrac,C.yellow,w/40+8);
      if(o.conf){d.fillStyle=o.conf;d.beginPath();d.arc(cx+w*0.22,h*0.75,Math.max(3,w/60),0,7);d.fill();}
      if(o.pop)t(d,cx-w*0.23,h*0.75,F.small,C.green,o.pop,{bold:1});}
    if(o.foot)t(d,cx,h*0.87,F.xtiny,C.lt,o.foot);}
  if(o.banner){const fh=F.medium+6,fy=o.coach?h*0.79:h*0.62,bw=w*0.78;d.fillStyle=o.bannerColor;d.beginPath();d.roundRect(cx-bw/2,fy-fh*0.75,bw,fh*1.5,fh/3);d.fill();t(d,cx,fy,F.medium,"#000",o.banner,{bold:1});}}
function summaryUx(d,w,h){const cx=w/2;t(d,cx,h*0.13,F.xtiny,C.lt,"WOD 2026-09-30");t(d,cx,h*0.28,F.large,C.yellow,"8 + 10",{bold:1});t(d,cx,h*0.38,F.xtiny,C.green,"NEW BEST",{bold:1});
  let y=h*0.50;["Time 12:00","Rounds 8  Reps 170","HR 162 / 181"].forEach(l=>{t(d,cx,y,F.tiny,C.white,l);y+=F.tiny+8;});
  hintUx(d,w,h,true,C.green,"check");hintUx(d,w,h,false,C.lt,"cross");dotsUx(d,w,h,0,5);}
